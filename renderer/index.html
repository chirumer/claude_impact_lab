<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
<title>Messages</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span id="clock">9:41</span>
      <span class="statusbar-icons">•••</span>
    </div>

    <!-- Contacts / conversation list screen -->
    <section id="screen-contacts" class="screen">
      <header class="nav">
        <div class="nav-title-row">
          <h1>Messages</h1>
        </div>
        <div class="persona-switcher" id="persona-switcher"></div>
      </header>
      <div class="contact-list" id="contact-list"></div>
    </section>

    <!-- Thread screen -->
    <section id="screen-thread" class="screen hidden">
      <header class="thread-nav">
        <button id="back-btn" class="back-btn" aria-label="Back">
          <svg viewBox="0 0 24 24" width="14" height="22"><path d="M18 2 L6 12 L18 22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="thread-contact">
          <div class="avatar" id="thread-avatar">R</div>
          <div class="thread-name" id="thread-name">RestoLine</div>
        </div>
      </header>

      <div id="api-key-banner" class="api-key-banner hidden">
        No ANTHROPIC_API_KEY found. Copy <code>.env.example</code> to <code>.env</code>, add your key from
        <span>console.anthropic.com</span> (and a Voyage AI key for embeddings), then restart the app.
      </div>

      <div class="messages" id="messages"></div>

      <div id="reply-banner" class="reply-banner hidden">
        <div class="reply-banner-text">
          <div class="reply-banner-label">Replying with feedback to RestoLine</div>
          <div class="reply-banner-quote" id="reply-banner-quote"></div>
        </div>
        <button id="reply-cancel" aria-label="Cancel reply">✕</button>
      </div>

      <form id="composer" class="composer">
        <input id="composer-input" type="text" placeholder="Text Message" autocomplete="off" />
        <button type="submit" id="composer-send" aria-label="Send">
          <svg viewBox="0 0 32 32" width="18" height="18"><circle cx="16" cy="16" r="16" fill="#0a84ff"/><path d="M16 22 V10 M11 15 L16 10 L21 15" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
